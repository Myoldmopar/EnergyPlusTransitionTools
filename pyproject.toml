[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"


[project]
name = "energyplus_transition_tools"
dynamic = ["version"]
description = "A library and tkinter-based tool for transitioning EnergyPlus input files"
authors = [
    {name = "Edwin Lee"},
]
maintainers = [
    {name = "Edwin Lee"},
    {name = "Julien Marrec"},
]
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE.txt"]
keywords = [
    "EnergyPlus", "eplus", "Energy+",
    "building energy modeling",
    "EnergyPlusTransitionTools", "energyplus_transition_tools",
    "Building Simulation", "Whole Building Energy Simulation",
    "Heat Transfer", "HVAC", "Modeling",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Natural Language :: French",
    "Natural Language :: Spanish",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Utilities",
]
dependencies = [
    "PLAN-Tools>=0.5",
    "pypiwin32; os_name == 'nt'",
]

[project.urls]
Homepage = "https://github.com/myoldmopar/EnergyPlusTransitionTools"

[project.gui-scripts]
energyplus_transition_gui = "energyplus_transition.runner:main_gui"

[project.scripts]
energyplus_transition = "energyplus_transition.cli:main"
energyplus_transition_configure = "energyplus_transition.configure:configure_cli"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "black", "flake8", "mypy", "isort", "coveralls", "wheel", "bump2version"]

[tool.setuptools.dynamic]
version = {attr = "energyplus_transition.__version__"}

[tool.setuptools.package-data]
energyplus_transition = ["icons/*.png", "icons/*.ico", "icons/*.icns"]

[tool.black]
line-length = 120
skip-string-normalization = false
target-version = ['py312']
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 120
skip_gitignore = true

[tool.pytest.ini_options]
addopts = "--cov=energyplus_transition --cov-branch --cov-report=term-missing --cov-report=xml"

[tool.mypy]
disallow_untyped_defs = true
