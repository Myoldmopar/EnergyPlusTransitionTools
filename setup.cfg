[nosetests]
traverse-namespace=1
with-coverage=1
cover-erase=1
cover-html=1
cover-package=energyplus_transition
cover-tests=1
cover-inclusive=1

[flake8]
max-line-length = 120
# Ignore missing docstrings (D100-D107): public module, class, method, function, package, magic method, nested class, __init__
extend-ignore = D100,D101,D102,D103,D104,D105,D106,D107
