name: Publish to TestPyPI

on:
  push:
    branches: [ main ]

  workflow_dispatch:

jobs:
  publish_dev_build:
    runs-on: ubuntu-latest

    environment: testpypi

    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing

    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-python@v6
      with:
        python-version: 3.12

    - name: Set dev version
      run: |
        VERSION=$(grep -oP '(?<=__version__ = ")[^"]+' energyplus_transition/__init__.py)
        NEW_VERSION="${VERSION}.dev${GITHUB_RUN_NUMBER}"
        echo "New version: ${NEW_VERSION}"
        sed -i "s/__version__ = \".*\"/__version__ = \"${NEW_VERSION}\"/" energyplus_transition/__init__.py

    - name: Install build
      run: pip install build

    - name: Build
      run: python -m build

    - name: Publish to TestPyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/
        skip-existing: true
        verbose: true
